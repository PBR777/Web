<!DOCTYPE html>

<html>

<head>
  <script src="/script.js"></script>

  <script src="/components/init.js"></script>

  <style>
    .writing-text {
      white-space: pre-wrap;
      size: 10px;
      overflow-wrap: break-word;
    }

    .writing-msg {
      width: 100%;
      min-height: 100px;

      display: flex;
      flex-direction: column;
      justify-content: center;

      color: #080e3fbe;
      font-weight: bold;
      text-shadow: none;
      font-size: large;
      font-family: monospace;
    }

    .writing-title {
      text-align: center;

      font-size: 180%;
    }
  </style>
</head>

<body>
  <p-component id="upper_banner"></p-component>

  <h1>Writings</h1>

  <div class="body">
    <script id="script" type="module">
      const fragment = document.createDocumentFragment();
      const p = document.createElement("p");
      const title = document.createElement("h2");
      const msg = document.createElement("div");
      fragment.append(msg, title, p);

      p.innerText = "Loading...";
      p.classList.add("writing-text");
      msg.classList.add("writing-msg");
      title.classList.add("writing-title");

      async function hash(str) {
        const nameBuffer = new TextEncoder().encode(str);
        const array = await crypto.subtle.digest("sha-1", nameBuffer);
        return Array
          .from(new Uint8Array(array))
          .map(byte => byte.toString(16).padStart(2, "0"))
          .join("");
      }

      try {
        const params = new URLSearchParams(window.location.search);

        const name = params.get("n");
        if(!name) throw new Error("Missing parameter \"n\" (name)");

        const category = params.get("c");
        if(!name) throw new Error("Missing parameter \"c\" (category)");

        const hashcode = await hash(name);
        const res = await fetch(`/data/writings/${category}/${hashcode}.txt`);
        if(!res.ok) throw new Error(`Cannot find Writing:${category}/${hashcode}(${name})`);
        
        const writing = await res.text();

        const parts = writing
          .replaceAll("  ", "　")
          .replaceAll("\r", "")
          .split("\n\n");

        msg.innerHTML = `写作时间：<br>${parts.shift().replaceAll("\n", "<br>")}<br><br>作者：<br>${parts.shift().split(";").map(name => name.trim()).join("<br>")}`;

        title.innerHTML = parts.shift();
        
        p.innerText = parts.join("\n\n")
      } catch(err) {
        p.innerText = "Load failed \n" + err.message;
      }

      document
        .querySelector(".body")
        .append(fragment);
      
      document.getElementById("script").remove();
    </script>
  </div>
</body>

</html>
