<!DOCTYPE html>

<html>
<head>
  <title>Fe5 Wiki</title>

  <link rel="stylesheet" href="/fe5/root.css">
  <script type="module" src="/fe5/root.js"></script>

  <style>
    body {
      overflow-x: hidden;
    }

    body::-webkit-scrollbar {
      display: none;
    }

    .wiki-tab-menu {
      margin-top: 10px;

      width: 80%;

      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }

    .wiki-tab {
      border: 1.5px solid #1b1b1b;
      background-color: #2e2e2e;

      text-align: center;

      flex-grow: 1;
      max-width: 100px;
      min-width: fit-content;

      padding: 3px 8px;
      cursor: pointer;
      user-select: none;

      z-index: 20;

      transition: background-color 200ms;
    }

    .wiki-tab:hover {
      background-color: #222222;
    }

    .wiki-tab-selected,
    .wiki-tab-selected:hover {
      background-color: #1a1a1a;
    }

    .wiki-description {
      text-align: center;
    }

    .wiki-div {
      position: absolute;
      display: flex;
      justify-content: center;
      width: 80%;
    }

    @keyframes fadein {
      0% {
        opacity: 0;
        scale: 0.9;
        translate: 0 100px;
      }
    }

    @keyframes fadeout-left {
      100% {
        opacity: 0;
        scale: 0.9;
        translate: -30% 20px;
        rotate: -20deg;
      }
    }

    @keyframes fadeout-right {
      100% {
        opacity: 0;
        scale: 0.9;
        translate: 30% 20px;
        rotate: 20deg;
      }
    }

    .wiki-anchor {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .wiki-box.wiki-box-showing {
      z-index: 10;
    }

  </style>

  <script type="module">
    import { create, fetchJson } from "/fe5/modules/index.js";
    import { loadMap } from "/fe5/modules/map.js";
    import { getSkyObject } from "/fe5/modules/solar.js";

    const ANI_DURATION = 300;

    let previousIndex = -1;

    const tabData = await fetchJson("/fe5/data/wiki/index.json");
    tabData.map((item, i) => item.i = i);

    const description = create("span", ".wiki-description")
      .setText("　");

    const tabMenu = create("div", ".wiki-tab-menu")
      .addListener("click", ev => {
        const target = ev.target;
        if(!target.classList.contains("wiki-tab")) return;

        changePage(tabData[parseInt(target.dataset.i)]);
      });

    function changePage(data) {

      if(previousIndex === data.i) return;

      tabMenu.select(".wiki-tab-selected")
        ?.removeClass("wiki-tab-selected");

      tabMenu.select(`.wiki-tab-${data.path}`)
        ?.addClass("wiki-tab-selected");

      description.setHTML(data.description ?? "　");
      if(!data.content) {
        data.content = create("text-box");
        const statusText = create("span")
          .setStyle("text-align", "center")
          .setText("加载中...")
          .appendTo(data.content);

        generateContent(data).then(content => {
            data.content
              .setHTML("")
              .append(content);
          }).catch(err => {
            console.error(err);
            
            statusText.setText(`加载失败 U_U\n\n${err}`)
          });
      }

      const fadeDirection = data.i > previousIndex ? "left" : "right";

      const anchor = create("div", ".wiki-anchor.wiki-box-showing")
        .setStyle("animation", `fadein ${ANI_DURATION}ms 1 forwards`);

      const div = create("div", ".wiki-div")
        .append(data.content)
        .appendTo(anchor);

      document.querySelectorAll(".wiki-box-showing").forEach(e => {
        e.classList.remove(".wiki-box-showing");
        e.style.animation = `fadeout-${fadeDirection} ${ANI_DURATION}ms 1 forwards`;
        setTimeout(() => e.remove(), ANI_DURATION);
      });

      anchor.appendTo(document.body);

      previousIndex = data.i;
    }

    async function generateContent(data) {
      const fragment = document.createDocumentFragment();

      if(!data["dynamic-js"]) {
        
        const json = await fetchJson(`/fe5/data/wiki/${data.path}.json`);

        for(const link of json) {
          create("a", ".wiki-links")
            .setText(link.name)
            .setAttribute("href", `/fe5/wiki/${data.path}/${link.path}/`)
            .appendTo(fragment);
        }
        
        return fragment;
      }

      switch(data.path) {
        case "locations":

        create("ah-")
          .setText("Fe5地图")
          .appendTo(fragment)
        create("info-box")
          .append(await loadMap("fe5-winkel_tripel-lined"))
          .appendTo(fragment);

        break

        case "solar":

        create("style")
          .setText(`
            .li {
              display: flex;
              align-items: center;
              width: 100%;
              white-space-collapse: preserve;

              line-height: 1;
              

              user-select: none;
              cursor: pointer;
            }

            .indents {
              font-size: 150%;
            }

            .links {
              display: inline-block;
              font-size: 110%;

              width: fit-content;
              padding: 0 5px;
              

              transition: background-color 200ms;
            }

            .links:hover {
              background-color: var(--background-glow);
            }
          `).appendTo(fragment);

        const tree = [
          buildSolarTree(getSkyObject("sun-1"), "sun-2"),
          buildSolarTree(getSkyObject("sun-2"), "sun-1"),
          buildSolarTree(getSkyObject("electron"))
        ];

        fragment.append(generateSolarTree({
          name: "远征系",
          id: "sofar-system",
          children: tree
        }));
        

        break
      }

      return fragment;
    }

    function buildSolarTree(obj, culling) {
      if(obj.id === culling) return;

      const item = {
        name: obj.name,
        id: obj.id,
        children: []
      };

      if(!obj.hasChild) return item;

      for(const childObj of obj.children) {
        
        const child = buildSolarTree(childObj, culling);

        if(child) {
          item.children.push(child);
        }
      }

      return item;
    }

    function generateSolarTree(obj, selfIndent = "", childrenIndent = "") {
      if(!obj) return;

      const self = create("span", ".li")
        .append(
          create("span", ".indents")
            .setText(selfIndent), 
          create("a", ".links")
          .setAttribute("href", `/fe5/wiki/solar/${obj.id}/`)
          .setText(obj.name));

      if(obj.children.length === 0) return self.get();

      const fragment = document.createDocumentFragment();
      self.appendTo(fragment);
      
      for(const child of obj.children.slice(0, -1)) {
        const span = generateSolarTree(child, childrenIndent + "├", childrenIndent + "│");
        if(span) fragment.append(span)
      }

      fragment.append(generateSolarTree(obj.children.at(-1), childrenIndent + "└", childrenIndent + "　"))

      return fragment;
    }

    for(let i = 0; i < tabData.length; i++) {
      const data = tabData[i];
      create("div", `.wiki-tab.wiki-tab-${data.path}`)
        .setText(data.name)
        .setAttribute("data-i", i)
        .appendTo(tabMenu);
    }

    document.body.append(description.get(), tabMenu.get());
    changePage(tabData[0]);

  </script>
</head>
<body>
  <text-box>
    <p>欢迎来到Fe5 Wiki：一个只关于Fe5的百科。制度、地理、恒星系统、生物……等等都被记录于此。你想看些什么？</p>
  </text-box>
</body>
</html>
