<!DOCTYPE html>

<html>

<head>
  <title>Bio</title>

  <link rel="stylesheet" href="/fe5/root.css">

  <script type="module" src="/fe5/root.js"></script>

  <style>
    text-box {
      max-width: 800px;
    }

    #search-bar {
      width: 30%;
      min-width: 100px;
      max-width: 800px;

      text-align: center;

      transition: width 500ms;
    }

    #search-bar:focus {
      width: 70%;
    }

    #placeholder {
      display: block;
      width: 100%;
      text-align: center;
    }

    #result-text-div {
      text-align: center;
      font-size: 120%;

      padding: 8px 0;

      border-width: 3px;
      border-color: inherit;
      border-bottom-style: solid;
    }

    li {
      margin: 0;
    }

    .bio-links {
      display: inline-block;
      font-size: 110%;
      width: calc(100% - 30px);

      transition: background-color 200ms;
    }

    .bio-links:hover {
      background-color: var(--background-glow);
    }

    .bio-icon {
      width: 28px;
      image-rendering: pixelated;
    }

  </style>

  <script type="module">
    import IdUtils from "/fe5/modules/id.js";
    import { create, fetchJson } from "/fe5/modules/index.js";

    /**@type string[] */
    let idSet = [];

    const textbox = create("text-box");

    const resultTextDiv = create("div", "#result-text-div")
      .appendTo(textbox);

    const resultDiv = create("ol", "#search-result")
      .appendTo(textbox);

    const searchbar = create("input", "#search-bar")
      .addListener("input", (() => {
        let id;
        return () => {
          clearTimeout(id);
          id = setTimeout(update, 300);
        }
      })())
      .addListener("keydown", ev => {
        
        if(ev.keyCode !== 13) return; // Not pressed Enter

        update();
        if(resultDiv.childrenCount === 1)
          resultDiv.select(".bio-links").get().click();
      })
      .addListener("change", update)
      .get();

    searchbar.placeholder = "输入编号...";
    searchbar.maxLength = "16";

    /**
     * @param {string} str 
     */
    function search(str) {
      if(str.trim() === "") return idSet;

      const {zoneCode, id, fullId} = IdUtils.parse(str);
      let results = idSet;

      if(zoneCode) {
        results = results.filter(val => val[0] === zoneCode);
      }

      results = results
        .map(val => ({ name: val, weight: val.length - val.lastIndexOf(id)}))
        .filter(obj => obj.weight <= obj.name.length)
        .sort((a, b) => a.weight - b.weight)
        .map(obj => obj.name);

      return results;
    }

    let searchRecord;

    function update() {
      
      const str = searchbar.value.trim();
      if(str === searchRecord) return;
      searchRecord = str;

      const results = search(str);

      if(str === "") {
        resultTextDiv.setText(`${idSet.length}个编号已收录`);
      } else if(results.length === 0) {
        resultTextDiv.setText(`ID:${str}未找到，他/她可能未被收录，或者根本不存在\n\n￣へ￣`);
      } else {
        resultTextDiv.setText(`找到${results.length}个与ID:${str}相似的结果。已按相似度排序`);
      }

      const links = results.map(name => create("li").append(
        create("img", ".bio-icon")
          .setAttribute("src", `/fe5/assets/zone/${name[0]}.png`),
        create("a", ".bio-links")
          .setText(name)
          .setAttribute("href", `/fe5/bio/${name}/`)
        ).get());

      resultDiv.setHTML("");
      resultDiv.append(...links);

      return results;
    }

    (async () => {
      idSet = (await fetchJson("/fe5/data/bio/index.json")).sort();

      const url = new URLSearchParams(location.search);
      const id = url.get("id");
      if(id) searchbar.value = id;

      const results = update();

      if(url.has("redirect")) {
        url.delete("redirect");
        history.replaceState({}, "", "/fe5/bio/?" + url.toString());

        if(results && results.length === 1) {
          location.replace(`/fe5/bio/${results[0]}/`);
          return;
        }
      }

      document.body.querySelector("#placeholder").remove();
      document.body.append(searchbar, textbox.get());
    })().catch(err => {
      console.error(err);

      document.body.querySelector("#placeholder").innerText = `加载失败 :(\n${err}`;
    });

  </script>
</head>

<body>
  <span id="placeholder">加载中</span>
</body>
</html>
