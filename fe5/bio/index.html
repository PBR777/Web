<!DOCTYPE html>

<html lang="zh-CN">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio</title>

  <link rel="stylesheet" href="/fe5/root.css">

  <script type="module" src="/fe5/root.js"></script>

  <style>
    text-box {
      max-width: 800px;
    }

    #search-bar {
      width: 30%;
      min-width: 100px;
      max-width: 800px;

      text-align: center;

      transition: width 500ms;
    }

    #search-bar:focus {
      width: 70%;
    }

    #placeholder {
      display: block;
      width: 100%;
      text-align: center;
    }

    #result-text-div {
      text-align: center;
      font-size: 120%;

      padding: 8px 0;

      border-width: 3px;
      border-color: inherit;
      border-bottom-style: solid;
    }

    li {
      margin: 0;
    }

    .bio-links {
      display: inline-block;
      font-size: 110%;
      width: calc(100% - 30px);

      transition: background-color 200ms;
    }

    .bio-links:hover {
      background-color: var(--background-glow);
    }

    .bio-icon {
      width: 28px;
      image-rendering: pixelated;
    }

  </style>

  <script type="module">
    import IdUtils from "/fe5/modules/id.js";
    import { create, fetchJson } from "/fe5/modules/index.js";

    /**@type {HTMLLIElement[]} */
    const ids = (await fetchJson("/fe5/data/bio/index.json"))
      .sort()
      .map(id => create("li").setAttr("data-id", id).append(
        create("img", ".bio-icon")
          .setAttr("src", `/fe5/assets/zone/${id[0]}.png`),
        create("a", ".bio-links")
          .setText(id)
          .setAttr("href", `/fe5/bio/${id}/`)
        ).raw);

    const resultTextDiv = document.querySelector("#result-text-div");

    const resultDiv = document.querySelector("#search-result");

    /**@type {HTMLInputElement} */
    const searchbar = document.querySelector("#search-bar");
    searchbar.oninput = (() => {
      let id;
      return () => {
        clearTimeout(id);
        id = setTimeout(update, 300);
      }
    })();

    searchbar.onkeydown = ev => {
      if(ev.key !== "Enter") return; // Not pressed Enter
      update();
      
      if(resultDiv.childElementCount === 1) resultDiv.querySelector(".bio-links").click();
    };

    searchbar.onchange = update;

    function search(str) {
      if(str === "") return ids;

      const {zoneCode, id, fullId} = IdUtils.parse(str);
      let results = ids;

      if(zoneCode) results = results.filter(e => e.dataset.id[0] === zoneCode);

      return results
        .map(li => ({ li, weight: li.dataset.id.length - li.dataset.id.lastIndexOf(id)}))
        .filter(obj => obj.weight <= obj.li.dataset.id.length)
        .sort((a, b) => a.weight - b.weight)
        .map(obj => obj.li);
    }

    let searchRecord;

    function update() {
      const str = searchbar.value.trim();
      if(str === searchRecord) return;
      searchRecord = str;

      const results = search(str);

      if(str === "") {
        resultTextDiv.innerText = `${results.length}个编号已收录`;
      } else if(results.length === 0) {
        resultTextDiv.innerText = `ID:${str}未找到，他/她可能未被收录，或者根本不存在\n\n￣へ￣`;
      } else {
        resultTextDiv.innerText = `找到${results.length}个与ID:${str}相似的结果。已按相似度排序`;
      }

      resultDiv.innerHTML = "";
      resultDiv.append(...results);
    }

    async function load() {
      const params = new URLSearchParams(location.search);
      const id = params.get("id");
      if(id) searchbar.value = id;

      update();

      if(params.has("redirect")) {
        params.delete("redirect");
        history.replaceState({}, "", "/fe5/bio/?" + params.toString());

        if(resultDiv.childElementCount === 1) return resultDiv.querySelector(".bio-links").click();
      }

      document.querySelector("#placeholder").remove();
    }

    try {
      await load();
    } catch(err) {
      console.error(err);
      document.querySelector("#placeholder").innerText = `加载失败 :(\n${err}`;
    }
  </script>
</head>

<body>
  <input id="search-bar" type="text" placeholder="输入编号..." maxlength="16">
  <text-box>
    <span id="placeholder">加载中...</span>
    <div id="result-text-div"></div>
    <ol id="search-result"></ol>
  </text-box>
</body>
</html>
