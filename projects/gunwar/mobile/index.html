<!DOCTYPE html>

<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title></title>

  <style>
    html::-webkit-scrollbar {
      display: none;
    }

    html {
      background-color: black;
      user-select: none;
    }

    iframe {
      position: absolute;

      top: 0;
      left: 0;
      width: 100%;
      height: 100%;

      z-index: -999;
    }

    #joystick {
      position: absolute;
      left: 10%;
      bottom: 10%;
      width: 200px;
      height: 200px;

      border: 3px solid #7474742f;
      border-radius: 100%;
    }

    #joystick-stick {
      position: absolute;
      width: 30%;
      height: 30%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      background-color: #31313154;
      border: 3px solid #6666661e;
      border-radius: 100%;
    }

    #fire {
      position: absolute;
      width: 50px;
      height: 50px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      background-color: #31313149;
      border: 3px solid #6666661e;
      border-radius: 100%;
    }

    #dash {
      position: absolute;
      width: 80px;
      height: 80px;
      right: 15%;
      bottom: 15%;

      background-color: #31313149;
      border: 3px solid #6666661e;
      border-radius: 100%;
    }
  </style>

  <script type="module">
    const INPUT_LIST_NAME = "@ToSimulate";
    /**@type {HTMLIFrameElement} */
    const iframe = document.getElementById("main-iframe");

    const joystickParent = document.getElementById("joystick");
    const joystick = document.getElementById("joystick-stick");
    let isJoystickDown = false;
    
    function onLoad() {
      // const runtime = vm.runtime;
      // if(!runtime) return;

      // const stage = vm.runtime.targets.find(t => t.isStage);

      // /**@type {[]} */
      // const input = Array.from({ length: 64 }, () => 0);
      // let success = false;
      // for(const varId in stage.variables) {
      //   const variable = stage.variables[varId];

      //   if(variable.name === INPUT_LIST_NAME
      //   && Array.isArray(variable.value)) {
      //     variable.value = input;
      //     success = true;
      //     break;
      //   }
      // }

      // if(!success) return;

      // input[0] = 1;

      const joystickDrag = (ev => {
        if(!isJoystickDown) return;

        const rect = joystickParent.getBoundingClientRect();
        const direction = Math.round(Math.atan2(ev.y - rect.y - rect.height / 2, ev.x - rect.x - rect.width / 2) / (Math.PI / 4)) * Math.PI / 4;

        const x = Math.cos(direction);
        const y = Math.sin(direction);
        joystick.style.translate = `${x * 65}px ${y * 65}px`;
      });

      iframe.contentDocument.addEventListener("mousemove", joystickDrag);
      joystickParent.addEventListener("mousemove", joystickDrag);

      joystickParent.addEventListener("mouseup", () => {
        isJoystickDown = false;
        joystick.style.translate = null;
      });

      joystickParent.addEventListener("mousedown", () => {
        isJoystickDown = true;
      });
    }

    iframe.addEventListener("onload", onLoad, { once: true });
    onLoad()

  </script>
</head>
<body>
  <iframe id="main-iframe" src="" frameborder="0"></iframe>

  <div id="joystick">
    <div id="joystick-stick"></div>
  </div>

  <div id="fire"></div>

  <div id="dash"></div>
</body>
</html>
