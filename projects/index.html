<!DOCTYPE html>

<html lang="zh-CN">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects</title>

  <link rel="stylesheet" href="/style.css">

  <script type="module" src="/script.js"></script>

  <style>
    .gameshot {
      min-width: 240px;
      min-height: 180px;

      max-width: 480px;
      max-height: 360px;

      width: 100%;

      cursor: pointer;

      margin-bottom: 20px;
    }
  </style>

  <script type="module">
    const PROJECT_ROOT = "/projects/";
    
    async function load() {
      const fragment = document.createDocumentFragment();
      const res = await fetch("/data/projects/index.json");
      
      for(const data of await res.json()) {
        const title = document.createElement("h3");
        title.innerHTML = data.name;
        fragment.append(title);

        if(data.description) {
          const description = document.createElement("p");
          description.innerHTML = data.description.join("<br>");

          fragment.append(description);
        }

        const gameshot = document.createElement("img");
        gameshot.classList.add("gameshot");
        gameshot.loading = "lazy";
        gameshot.alt = data.name + " 的截图";
        gameshot.src = `${PROJECT_ROOT}${data.id}/thumbnail.${data.isSvgThumbnail ? "svg" : "webp"}`;
        gameshot.dataset.gameId = data.id;
        fragment.append(gameshot);
      }

      const body = document.querySelector(".body");
      body.innerHTML = "";
      body.append(fragment);
      body.addEventListener("click", ev => {
        const target = ev.target;
        if(!target.classList.contains("gameshot")
        || !target.dataset.gameId) return;
        
        location.href = `${PROJECT_ROOT}${target.dataset.gameId}/`;
      });
    }

    await load();
  </script>
</head>

<body>
  <div class="body">
    <h2>加载中...</h2>
  </div>
</body>

</html>
