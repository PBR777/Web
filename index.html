<!DOCTYPE html>

<html lang="zh-CN">

<head>
  <title>PBR's Web</title>

  <link rel="stylesheet" href="/style.css">

  <script type="module" src="/script.js"></script>

  <style>
    #demo {
      text-align: center;

      margin: auto;
      margin-bottom: 50px;

      width: 90%;
      max-width: 960px;
    }

    #demo>iframe {
      width: 100%;
      height: 100%;
    }
  </style>

  <script id="script" type="module">
    let cd = 7;
    document.querySelector("h1").addEventListener("click", () => {
      console.log("Why do you do that?");
      if(--cd <= 0) window.location.href = "/fe5/";
    });

    document.getElementById("script").remove();
  </script>

  <script type="module">
    const div = document.getElementById("demo");

    const button = document.createElement("button");
    button.innerHTML = "<p><b>–––→ 为什么我要使用Scratch ←–––</b></p>";
    button.style.padding = "15px 60px";

    button.onclick = () => {
      const resizeHandler = () => div.style.height = `${div.clientWidth * 0.75}px`;

      window.addEventListener("resize", resizeHandler);
      resizeHandler();

      const iframe = document.createElement("iframe");
      iframe.src = "https://turbowarp.org/1218039929/embed?limitless&hqpen";
      iframe.innerText = "Well it looks like the iframe is failed to load or embed :(";
      iframe.setAttribute("frameborder", "0");

      button.remove();
      div.append(iframe);
    };

    div.append(button);
  </script>
</head>
